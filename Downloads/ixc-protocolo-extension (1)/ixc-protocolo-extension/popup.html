<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <title>IXC Protocolo Navigator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      font-size: 13px;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #1a56db 0%, #0e9f6e 100%);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-icon { font-size: 22px; }
    .header-title { font-size: 13px; font-weight: 700; color: #fff; }
    .header-sub   { font-size: 10px; color: rgba(255,255,255,.7); margin-top: 1px; }

    /* ── Body ── */
    .body { padding: 12px; display: flex; flex-direction: column; gap: 10px; }

    /* ── Mensagem ── */
    .msg {
      font-size: 11px;
      padding: 7px 10px;
      border-radius: 6px;
      display: none;
      line-height: 1.4;
    }
    .msg.show-error  { display:block; background:#ef444415; color:#f87171; border:1px solid #ef444430; }
    .msg.show-ok     { display:block; background:#0e9f6e15; color:#0e9f6e;  border:1px solid #0e9f6e30; }
    .msg.show-info   { display:block; background:#1a56db15; color:#60a5fa;  border:1px solid #1a56db30; }

    /* ── Labels ── */
    .label {
      font-size: 10px; font-weight:600;
      color:#4b5563; text-transform:uppercase;
      letter-spacing:.05em; margin-bottom:4px;
    }

    /* ── Inputs ── */
    input[type=text] {
      width:100%; background:#161b22; border:1px solid #21262d;
      border-radius:6px; color:#c9d1d9; font-size:12px;
      padding:7px 10px; outline:none; transition:border-color .2s;
    }
    input[type=text]:focus { border-color:#1a56db; }
    input[type=text]::placeholder { color:#3d444d; }

    .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }

    /* ── Buttons ── */
    .btn {
      border:none; border-radius:7px; font-size:12px;
      font-weight:600; cursor:pointer; padding:9px 10px;
      transition:all .18s; display:flex; align-items:center;
      justify-content:center; gap:6px;
    }
    .btn:disabled { opacity:.4; cursor:not-allowed; }

    .btn-blue   { background:#1a56db; color:#fff; }
    .btn-blue:hover:not(:disabled) { background:#1447c0; }

    .btn-green  { background:#0e9f6e; color:#fff; font-size:13px; padding:11px; }
    .btn-green:hover:not(:disabled) { background:#057a55; }

    .btn-ghost  { background:transparent; color:#6b7280; border:1px solid #21262d; }
    .btn-ghost:hover:not(:disabled) { background:#161b22; color:#c9d1d9; }

    .btn-red    { background:transparent; color:#f87171; border:1px solid #ef444430; }
    .btn-red:hover:not(:disabled) { background:#ef444410; }

    /* ── Status card ── */
    .card {
      background:#161b22; border:1px solid #21262d;
      border-radius:8px; padding:12px;
    }
    .card-top {
      display:flex; align-items:center;
      justify-content:space-between; margin-bottom:8px;
    }
    .badge {
      font-size:9px; font-weight:700; padding:3px 8px;
      border-radius:20px; text-transform:uppercase;
    }
    .badge-ok  { background:#0e9f6e20; color:#0e9f6e; border:1px solid #0e9f6e40; }
    .badge-end { background:#f59e0b20; color:#f59e0b; border:1px solid #f59e0b40; }
    .badge-err { background:#ef444420; color:#f87171; border:1px solid #ef444440; }

    .prog-text       { font-size:11px; color:#4b5563; }
    .prog-text strong{ color:#c9d1d9; }

    .proto-lbl { font-size:10px; color:#4b5563; margin-top:2px; }
    .proto-num {
      font-size:20px; font-weight:800;
      color:#60a5fa; letter-spacing:1px; margin:2px 0 6px;
      word-break:break-all;
    }

    .bar-wrap { background:#21262d; border-radius:4px; height:4px; overflow:hidden; }
    .bar-fill {
      height:100%; border-radius:4px;
      background:linear-gradient(90deg,#1a56db,#0e9f6e);
      transition:width .4s ease;
    }

    /* ── Nav buttons ── */
    .nav3 { display:grid; grid-template-columns:1fr 2fr 1fr; gap:6px; }

    /* ── Divider ── */
    .div { height:1px; background:#21262d; }

    /* ── Sections ── */
    #sec-auth { text-align:center; }
    #sec-auth p { font-size:12px; color:#4b5563; margin-bottom:10px; line-height:1.5; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-icon">📋</div>
  <div>
    <div class="header-title">IXC Protocolo Navigator</div>
    <div class="header-sub">Automação de busca via Google Sheets</div>
  </div>
</div>

<div class="body">

  <div id="msg" class="msg"></div>

  <!-- CONFIG -->
  <div id="sec-config">
    <div class="label">ID da Planilha Google Sheets</div>
    <input type="text" id="inp-sheet-id" placeholder="1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs..."/>

    <div class="row2" style="margin-top:8px;">
      <div>
        <div class="label">Aba (Sheet)</div>
        <input type="text" id="inp-sheet-name" placeholder="Planilha1"/>
      </div>
      <div>
        <div class="label">Coluna</div>
        <input type="text" id="inp-sheet-col" placeholder="A"/>
      </div>
    </div>

    <div style="margin-top:8px;" class="row2">
      <div>
        <div class="label">Linha inicial</div>
        <input type="text" id="inp-start-row" placeholder="2"/>
      </div>
    </div>

    <button class="btn btn-blue" id="btn-save" style="width:100%;margin-top:10px;">
      💾 Salvar configuração
    </button>
  </div>

  <div class="div"></div>

  <!-- AUTH -->
  <div id="sec-auth">
    <p>Conecte sua conta Google para<br/>acessar a planilha com segurança.</p>
    <button class="btn btn-blue" id="btn-login" style="width:100%;">
      🔐 Entrar com Google
    </button>
  </div>

  <!-- NAV -->
  <div id="sec-nav" style="display:none;">

    <div class="card">
      <div class="card-top">
        <span class="badge badge-ok" id="badge">Pronto</span>
        <span class="prog-text">Protocolo <strong id="txt-cur">—</strong> de <strong id="txt-tot">—</strong></span>
      </div>
      <div class="proto-lbl">Protocolo atual</div>
      <div class="proto-num" id="txt-proto">—</div>
      <div class="bar-wrap">
        <div class="bar-fill" id="bar" style="width:0%"></div>
      </div>
    </div>

    <button class="btn btn-green" id="btn-next" style="width:100%;margin-top:6px;">
      ➡️ Próximo Protocolo
    </button>

    <div class="nav3" style="margin-top:6px;">
      <button class="btn btn-ghost" id="btn-prev">◀ Ant.</button>
      <button class="btn btn-ghost" id="btn-reload">🔄 Recarregar</button>
      <button class="btn btn-red"   id="btn-logout">Sair</button>
    </div>

  </div>

</div>

<script src="popup.js"></script>
</body>
</html>
